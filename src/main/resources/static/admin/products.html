<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 파비콘 — 헤더 로고의 너구리 마크를 배경 없이 그대로 쓴다(꼬리까지, 브랜드 그라데이션). -->
  <link rel="icon" href="/images/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/images/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/images/favicon-180.png" />
  <title>상품 현황 — GONG9RI 관리자</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
  />

  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div data-include="header"></div>

  <main>
    <section class="section container">
      <div class="section__head">
        <h1><span class="text-gradient">상품 종합 관리 및 푸시/제재 현황</span></h1>
        <p class="text-muted" style="margin-top: var(--space-2);">
          상품 성과 및 인사이트를 확인하고 관리자 조치를 수행합니다.
        </p>
      </div>

      <div id="page-alert" class="form-alert form-alert--error" role="alert" hidden>
        <span id="page-alert-text"></span>
      </div>

      <nav class="mypage-nav-tabs" role="tablist" aria-label="관리자 메뉴" style="margin-bottom: var(--space-6);">
        <a href="/admin/dashboard.html" class="mypage-tab-btn" role="tab" aria-selected="false">대시보드</a>
        <a href="/admin/members.html" class="mypage-tab-btn" role="tab" aria-selected="false">회원 관리</a>
        <a href="/admin/products.html" class="mypage-tab-btn active" role="tab" aria-selected="true">상품 현황</a>
        <a href="/admin/refunds.html" class="mypage-tab-btn" role="tab" aria-selected="false">환불 요청 현황</a>
        <a href="/admin/support.html" class="mypage-tab-btn" role="tab" aria-selected="false">상담 관리</a>
      </nav>

      <!-- 검색 및 상태 필터 바 -->
      <div class="card" style="padding: var(--space-4); margin-bottom: var(--space-5);">
        <div style="display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; justify-content: space-between;">
          <div style="display: flex; gap: var(--space-2); flex-wrap: wrap;">
            <button type="button" class="btn btn-primary btn-sm product-filter-btn active" data-filter="ALL">전체 상품</button>
            <button type="button" class="btn btn-secondary btn-sm product-filter-btn" data-filter="VISIBLE">📦 공개 상품</button>
            <button type="button" class="btn btn-secondary btn-sm product-filter-btn" data-filter="HIDDEN">⚠️ 숨김/제재 상품</button>
            <button type="button" class="btn btn-secondary btn-sm product-filter-btn" data-filter="PUSH">🚀 추천/인기 푸시</button>
            <button type="button" class="btn btn-secondary btn-sm product-filter-btn" data-filter="UPCOMING">⏱️ 오픈 예정 상품</button>
          </div>
          <div style="width: 280px; max-width: 100%;">
            <input type="text" id="product-search-input" class="form-input" placeholder="상품명, 판매자명 검색..." autocomplete="off" />
          </div>
        </div>
      </div>

      <div id="products-status" class="product-status">불러오는 중...</div>
      <div id="products-list" class="admin-grid-list"></div>

      <button type="button" id="load-more-btn" class="btn btn-secondary btn-block" style="margin-top: var(--space-4);" hidden>더 보기</button>
    </section>
  </main>

  <div data-include="footer"></div>

  <div data-include="support-widget"></div>

  <script src="/js/include.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/header-auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
  <script src="/js/support-chat-client.js"></script>
  <script src="/js/support-widget.js"></script>
  <script src="/js/header-search.js"></script>
  <script src="/js/header-notifications.js"></script>
  <script src="/js/header-wishlist-badge.js"></script>
  <script src="/js/admin-guard.js"></script>
  <script src="/js/admin-products.js"></script>
</body>
</html>
