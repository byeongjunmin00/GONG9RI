<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>상품 상세 — GONG9RI</title>

  <!-- 폰트: 헤딩 - Poppins(Google Fonts CDN), 본문 - Pretendard(jsdelivr CDN) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
  />

  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />

  <!-- 카카오 JS SDK — CDN 스크립트 태그로 로드(checkout.html의 PortOne 브라우저 SDK와 동일 패턴).
       이 태그가 전역 window.Kakao를 만든다 — js/product.js가 상품 상세 로드 후 Kakao.init(...)으로
       초기화하고, 공유 버튼 클릭 시 Kakao.Share.sendDefault(...)를 호출한다. -->
  <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
</head>
<body>
  <div data-include="header"></div>

  <main>
    <section class="section container">
      <!-- 참가/신설/혼자구매 등 액션 결과 공통 안내. js/product.js가 텍스트와 표시 여부를 제어한다. -->
      <div id="page-alert" class="form-alert" role="alert" hidden>
        <span id="page-alert-text"></span>
        <a id="page-alert-login-link" href="/login.html" hidden>로그인하기</a>
        <a id="page-alert-pay-link" href="#" hidden>결제하기</a>
      </div>

      <!-- 잘못된 접근 / 상품 없음 / 로딩 / 에러 상태. 이 상태가 보이는 동안 아래 상세 영역은 숨겨진다. -->
      <div id="product-status" class="product-status" role="status" hidden></div>

      <div id="product-detail" class="product-detail" hidden>
        <div id="product-image" class="card-image product-detail-image"></div>

        <div class="section__head">
          <div class="card-seller-row">
            <span id="product-seller" class="card-seller"></span>
            <span id="product-seller-trust" class="card-seller-trust" hidden>신뢰 판매자</span>
          </div>
          <h1 id="product-name"></h1>
        </div>

        <div class="product-price-box">
          <div class="product-price-row">
            <span class="text-muted" style="font-size: var(--fs-sm);">정가</span>
            <span id="product-base-price" class="card-price-base"></span>
          </div>
          <p class="text-muted" style="font-size: var(--fs-sm); margin-top: var(--space-1);">
            최대 <span id="product-max-participants"></span>명까지 모집합니다
          </p>

          <table id="price-tiers-table" class="price-tiers-table" hidden>
            <thead>
              <tr>
                <th>모집 인원</th>
                <th>1인당 가격</th>
              </tr>
            </thead>
            <tbody id="price-tiers-body"></tbody>
          </table>

          <!-- 신규 팀 신설 시 목표 인원(price_tier.minCount) 선택 UI. js/product.js가 라디오를 채워 넣고
               선택값을 create-team-btn 클릭 시 targetParticipants로 서버에 보낸다. 아무것도 고르지
               않으면 create-team-btn이 비활성화된다. -->
          <fieldset id="target-participants-field" class="target-participants-field" hidden>
            <legend>신설할 팀의 목표 인원을 선택하세요</legend>
            <div id="target-participants-options" class="target-participants-options"></div>
          </fieldset>

          <!-- 팀 성사 후 환불 불가 명시적 확인. 체크 전까지 create-team-btn/각 팀의 참가하기 버튼이
               비활성 상태를 유지한다(js/product.js). 혼자 구매하기는 이 제약과 무관해 영향받지 않는다. -->
          <label class="refund-notice-checkbox">
            <input type="checkbox" id="refund-notice-checkbox" />
            공구팀이 정원을 채워 성사되면(SUCCESS) 그 이후에는 어떠한 경우에도 환불이 불가능합니다.
            이 사실을 확인했습니다.
          </label>
        </div>

        <!-- 오픈예정(product/product-launch) — openAt이 미래인 상품만 보여준다. js/product.js가 제어한다. -->
        <div id="open-at-notice" class="form-alert" role="status" hidden></div>

        <div class="product-actions">
          <button type="button" id="buy-alone-btn" class="btn btn-secondary">혼자 구매하기</button>
          <button type="button" id="create-team-btn" class="btn btn-primary" disabled>신규 팀 신설하기</button>
          <button type="button" id="kakao-share-btn" class="btn btn-secondary" hidden>카카오톡 공유하기</button>
          <a href="/" class="btn btn-ghost">계속 쇼핑하기</a>
        </div>

        <div class="team-list-section">
          <h2>모집 중인 공구팀</h2>

          <!-- 팀 목록 로딩/빈 목록/에러 상태. -->
          <div id="team-status" class="product-status" role="status" hidden></div>

          <ul id="team-list" class="team-list"></ul>
        </div>

        <!-- 상품정보/리뷰/문의 탭 — 3개 콘텐츠를 탭으로 전환해 볼 수 있게 묶는다(docs/dev/ongoing/
             product-detail-tabs.md). 탭 전환은 각 패널의 hidden 속성만 토글하고, 리뷰/문의 데이터는
             기존과 동일한 시점(loadProduct() 성공 후, gong9ri:auth-resolved 도착 시)에 항상 먼저
             불러와 둔다 — 숨겨진 탭이라도 이미 데이터가 채워져 있다. -->
        <div class="product-tabs-section">
          <div class="product-tabs" role="tablist">
            <button
              type="button"
              id="product-tab-info"
              class="product-tab is-active"
              role="tab"
              aria-selected="true"
              aria-controls="product-info-panel"
              data-tab-target="product-info-panel"
            >상품정보</button>
            <button
              type="button"
              id="product-tab-reviews"
              class="product-tab"
              role="tab"
              aria-selected="false"
              aria-controls="reviews-panel"
              data-tab-target="reviews-panel"
            >리뷰</button>
            <button
              type="button"
              id="product-tab-inquiries"
              class="product-tab"
              role="tab"
              aria-selected="false"
              aria-controls="inquiries-panel"
              data-tab-target="inquiries-panel"
            >문의</button>
          </div>

          <div id="product-info-panel" class="product-tab-panel" role="tabpanel" aria-labelledby="product-tab-info">
            <p id="product-description" class="text-muted"></p>
            <!-- 상품 설명이 비어 있을 때만 노출되는 빈 상태 문구 (product-status--empty 패턴 재사용). -->
            <div id="product-description-status" class="product-status product-status--empty" role="status" hidden>등록된 상품 설명이 없습니다.</div>
          </div>

          <div id="reviews-panel" class="product-tab-panel reviews-section" role="tabpanel" aria-labelledby="product-tab-reviews" hidden>
            <div class="section__head">
              <h2>리뷰 <span id="review-average" class="text-muted" style="font-size: var(--fs-md); font-weight: 400;"></span></h2>
            </div>

            <!-- 리뷰 목록 로딩/빈 목록/에러 상태. -->
            <div id="reviews-status" class="product-status" role="status" hidden></div>

            <ul id="reviews-list" class="mypage-list"></ul>

            <!-- 리뷰 작성/수정 폼 — 로그인 안 한 사람에게도 항상 보이고, 자격이 없으면(구매 안 함/이미 작성함)
                 서버 응답(403/409)을 그대로 안내한다(js/product.js가 처리). -->
            <form id="review-form" novalidate>
              <div id="review-form-alert" class="form-alert" role="alert" hidden></div>

              <div class="form-group">
                <label class="form-label" for="review-rating">평점</label>
                <select id="review-rating" class="form-input">
                  <option value="5">5점 — 아주 만족</option>
                  <option value="4">4점 — 만족</option>
                  <option value="3">3점 — 보통</option>
                  <option value="2">2점 — 불만족</option>
                  <option value="1">1점 — 아주 불만족</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="review-content">내용</label>
                <textarea class="form-input" id="review-content" rows="3" maxlength="1000" placeholder="구매한 상품은 어땠나요?"></textarea>
              </div>

              <button type="submit" id="review-submit" class="btn btn-primary btn-sm">리뷰 작성</button>
            </form>
          </div>

          <div id="inquiries-panel" class="product-tab-panel inquiries-section" role="tabpanel" aria-labelledby="product-tab-inquiries" hidden>
            <div class="section__head">
              <h2>문의하기 <span id="inquiries-count" class="text-muted" style="font-size: var(--fs-md); font-weight: 400;"></span></h2>
            </div>

            <!-- 문의 목록 로딩/빈 목록/에러 상태. -->
            <div id="inquiries-status" class="product-status" role="status" hidden></div>

            <ul id="inquiries-list" class="mypage-list"></ul>

            <!-- 문의 작성/수정 폼 — 리뷰와 달리 구매 이력이 필요 없다. 로그인 안 한 사람에게도 항상
                 보이고, 비로그인 상태로 제출하면 서버 응답(401)을 그대로 안내한다(js/product.js가 처리).
                 판매자 답변 등록/수정/삭제 폼은 각 문의 항목 안에 개별적으로 표시된다(currentMemberId가
                 그 상품의 sellerId와 같을 때만, js/product.js). -->
            <form id="inquiry-form" novalidate>
              <div id="inquiry-form-alert" class="form-alert" role="alert" hidden></div>

              <div class="form-group">
                <label class="form-label" for="inquiry-content">문의 내용</label>
                <textarea class="form-input" id="inquiry-content" rows="3" maxlength="1000" placeholder="배송/옵션 등 궁금한 점을 남겨주세요."></textarea>
              </div>

              <button type="submit" id="inquiry-submit" class="btn btn-primary btn-sm">문의 작성</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div data-include="footer"></div>
  <div data-include="chat-widget"></div>

  <script src="/js/include.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/header-auth.js"></script>
  <script src="/js/header-search.js"></script>
  <script src="/js/header-notifications.js"></script>
  <script src="/js/header-wishlist-badge.js"></script>
  <script src="/js/chat-widget.js"></script>
  <!-- 실시간 메시징(공구팀 정원 변동 브로드캐스트)용 STOMP 클라이언트. 로드 실패 시 product.js가
       조용히 실시간 갱신 없이 기존 수동 새로고침 흐름으로 폴백한다. -->
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
  <script src="/js/product.js"></script>
</body>
</html>
