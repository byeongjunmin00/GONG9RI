<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>판매 물품 등록 — GONG9RI</title>

  <!-- 폰트: 헤딩 - Poppins(Google Fonts CDN), 본문 - Pretendard(jsdelivr CDN) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
  />

  <!-- 서브디렉토리(/seller/products/)에 있는 페이지라 CSS/JS/partial 참조는 반드시 절대경로로 쓴다. -->
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div data-include="header"></div>

  <main>
    <section class="section container">
      <div style="max-width: 640px; margin: 0 auto;">
        <div class="section__head" style="text-align: center;">
          <h1><span class="text-gradient">판매 물품 등록</span></h1>
          <p class="text-muted" style="margin-top: var(--space-2);">
            상품 정보와 공구 가격 구간을 입력해주세요.
          </p>
        </div>

        <!-- 필드로 원인을 특정할 수 없는 공통 에러/안내(예: VALIDATION_FAILED, 401, 403). js/seller-product-new.js가 제어한다. -->
        <div id="form-alert" class="form-alert" role="alert" hidden>
          <span id="form-alert-text"></span>
          <a id="form-alert-login-link" href="/login.html" hidden>로그인하기</a>
        </div>

        <form id="product-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="name">상품명</label>
            <input
              class="form-input"
              type="text"
              id="name"
              name="name"
              placeholder="상품명을 입력하세요"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="category">카테고리</label>
            <select class="form-input" id="category" name="category">
              <option value="FOOD">식품</option>
              <option value="LIVING">생활/주방</option>
              <option value="BEAUTY">뷰티</option>
              <option value="FASHION">패션/잡화</option>
              <option value="DIGITAL">디지털/가전</option>
              <option value="ETC">기타</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="description">상품 설명</label>
            <textarea
              class="form-textarea"
              id="description"
              name="description"
              placeholder="상품 설명을 입력하세요 (선택)"
            ></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="basePrice">정가</label>
            <input
              class="form-input"
              type="text"
              inputmode="numeric"
              id="basePrice"
              name="basePrice"
              placeholder="1인 구매 시 가격"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="maxParticipants">팀 최대 인원</label>
            <input
              class="form-input"
              type="number"
              id="maxParticipants"
              name="maxParticipants"
              min="2"
              step="1"
              placeholder="공구팀 최대 모집 인원"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="imageUrl">상품 이미지 URL</label>
            <input
              class="form-input"
              type="text"
              id="imageUrl"
              name="imageUrl"
              placeholder="예: https://images.pexels.com/photos/2294477/pexels-photo-2294477.jpeg (선택)"
            />
          </div>

          <div class="form-group">
            <label class="form-label" id="price-tiers-label">가격 구간</label>
            <p class="form-hint">
              모집 인원(정원) 구간별 1인당 가격을 최소 인원 오름차순으로 입력하세요. 최소 1개 이상 필요합니다.
              여기서 "구간"은 한 팀 안에서 인원이 늘어남에 따라 바뀌는 것이 아니라, 이 상품의 정원 자체가
              어느 구간에 속하는지에 따라 정해집니다 — 정원을 나중에 수정하면 그 이후 새로 만들어지는
              팀부터 다른 구간이 적용됩니다.
            </p>

            <div id="price-tier-rows" class="price-tier-rows" role="group" aria-labelledby="price-tiers-label"></div>

            <button type="button" id="add-price-tier-btn" class="btn btn-ghost btn-sm">+ 가격 구간 추가</button>

            <!-- 가격 구간 클라이언트 가드레일 검증 에러(오름차순/중복/범위). 최종 판정은 서버 응답이다. -->
            <p id="price-tiers-error" class="form-error" role="alert" hidden></p>
          </div>

          <!-- 오픈예정(product/product-launch) — 비워두면 기존과 동일하게 등록 즉시 공개. 값을 넣으면
               미래 시각이어야 하고, 그 전까지는 구매·팀 신설이 서버에서 거절된다. -->
          <div class="form-group">
            <label class="form-label" for="openAt">오픈예정 시각 (선택)</label>
            <input class="form-input" type="datetime-local" id="openAt" name="openAt" />
            <p class="form-hint">비워두면 등록 즉시 공개됩니다. 미래 시각을 넣으면 그 전까지 목록에는 "오픈예정"으로 노출되고 구매는 막힙니다.</p>
          </div>

          <!-- 참여 취소(공구팀)로 생기는 환불 요청을 승인 절차 없이 즉시 처리할지 여부(상품 단위 설정).
               솔로 구매 직접 환불 요청에는 영향 없음(항상 판매자 승인 필요). -->
          <label class="refund-notice-checkbox">
            <input type="checkbox" id="auto-refund-on-cancel" />
            구매자가 공구팀 참여를 취소하면, 그로 인해 생기는 환불 요청을 제 승인 없이 즉시 처리합니다
            (자동 환불). 체크하지 않으면 참여 취소로 생긴 환불 요청도 제가 직접 승인/거절해야 합니다.
          </label>

          <div class="product-actions">
            <button type="submit" id="submit-btn" class="btn btn-primary">등록하기</button>
            <a href="/" class="btn btn-secondary">취소하기</a>
          </div>
        </form>
      </div>
    </section>
  </main>

  <div data-include="footer"></div>
  <div data-include="chat-widget"></div>

  <script src="/js/include.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/header-auth.js"></script>
  <script src="/js/header-search.js"></script>
  <script src="/js/header-notifications.js"></script>
  <script src="/js/header-wishlist-badge.js"></script>
  <script src="/js/chat-widget.js"></script>
  <script src="/js/seller-product-new.js"></script>
</body>
</html>
