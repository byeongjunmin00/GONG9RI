<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 파비콘 — 헤더 로고의 너구리 마크를 배경 없이 그대로 쓴다(꼬리까지, 브랜드 그라데이션).
       크기별로 선 굵기만 다르다: 작게 줄일수록 원본 아웃라인이 픽셀보다 얇아져 사라지기 때문.
       16px에서는 그래도 뭉개지는데, 요즘 디스플레이는 16px 자리에도 32px를 가져가므로
       실사용에서는 대부분 또렷한 쪽을 보게 된다(2026-08-20).
       하위 디렉터리 페이지도 있어 경로는 절대경로다. -->
  <link rel="icon" href="/images/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/images/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/images/favicon-180.png" />
  <title>판매자 마이페이지 — GONG9RI</title>

  <!-- 폰트: 헤딩 - Poppins(Google Fonts CDN), 본문 - Pretendard(jsdelivr CDN) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
  />

  <!-- 서브디렉토리(/seller/)에 있는 페이지라 CSS/JS/partial 참조는 반드시 절대경로로 쓴다. -->
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div data-include="header"></div>

  <main>
    <section class="section container">
      <div class="section__head">
        <h1><span class="text-gradient">판매자 마이페이지</span></h1>
      </div>

      <!-- 401 로그인 필요 안내(세 API 중 하나라도 401이면 표시하고 아래 섹션 전체를 숨긴다). -->
      <div id="page-alert" class="form-alert" role="alert" hidden>
        <span id="page-alert-text"></span>
        <a id="page-alert-login-link" href="/login.html" hidden>로그인하기</a>
      </div>

      <div id="mypage-sections">
        <!-- 상단 대시보드 요약 (프로필 + 수익 KPI) -->
        <div class="mypage-profile-card">
          <div class="mypage-profile__user">
            <div class="mypage-profile__avatar" aria-hidden="true">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"></path>
                <line x1="16" y1="11" x2="16" y2="11"></line>
                <line x1="12" y1="11" x2="12" y2="11"></line>
              </svg>
            </div>
            <div class="mypage-profile__info">
              <h2 id="summary-user-name" class="mypage-profile__name">판매자</h2>
              <span id="summary-user-email" class="mypage-profile__email">로딩 중...</span>
            </div>
          </div>
          <div class="mypage-summary-grid">
            <div class="summary-card">
              <span class="summary-card__label">총 매출</span>
              <span id="summary-revenue-total" class="summary-card__value">-</span>
            </div>
            <div class="summary-card">
              <span class="summary-card__label">결제 완료</span>
              <span id="summary-revenue-paid-count" class="summary-card__value">-</span>
            </div>
            <div class="summary-card">
              <span class="summary-card__label">환불 건수</span>
              <span id="summary-revenue-refunded-count" class="summary-card__value">-</span>
            </div>
            <button type="button" class="summary-card" data-tab="refunds">
              <span class="summary-card__label">대기 환불</span>
              <span id="summary-pending-refunds-count" class="summary-card__value">-</span>
            </button>
          </div>
        </div>

        <!-- 탭 네비게이션 -->
        <nav class="mypage-nav-tabs" role="tablist" aria-label="판매자 마이페이지 메뉴">
          <button type="button" class="mypage-tab-btn active" role="tab" aria-selected="true" aria-controls="mypage-sections" id="tab-btn-all" data-tab="all">전체 현황</button>
          <button type="button" class="mypage-tab-btn" role="tab" aria-selected="false" aria-controls="tab-orders" id="tab-btn-orders" data-tab="orders">📦 주문·배송 관리</button>
          <button type="button" class="mypage-tab-btn" role="tab" aria-selected="false" aria-controls="tab-products" id="tab-btn-products" data-tab="products">등록 상품</button>
          <button type="button" class="mypage-tab-btn" role="tab" aria-selected="false" aria-controls="tab-teams" id="tab-btn-teams" data-tab="teams">공구 현황</button>
          <button type="button" class="mypage-tab-btn" role="tab" aria-selected="false" aria-controls="tab-refunds" id="tab-btn-refunds" data-tab="refunds">환불 관리</button>
          <button type="button" class="mypage-tab-btn" role="tab" aria-selected="false" aria-controls="tab-account" id="tab-btn-account" data-tab="account">계정 설정</button>
        </nav>

        <!-- 주문·배송 관리 -->
        <section id="tab-orders" class="mypage-section mypage-tab-panel" role="tabpanel" aria-labelledby="tab-btn-orders" data-tab-panel="orders">
          <div class="section__head">
            <h2>주문 및 배송 준비 관리</h2>
          </div>

          <div id="orders-status" class="product-status" role="status" hidden></div>

          <ul id="orders-list" class="mypage-list"></ul>
        </section>

        <!-- 등록 상품 목록 -->
        <section id="tab-products" class="mypage-section mypage-tab-panel" role="tabpanel" aria-labelledby="tab-btn-products" data-tab-panel="products">
          <div class="section__head">
            <h2>등록 상품 목록</h2>
          </div>

          <!-- 로딩/빈 목록/에러(403 등) 상태. js/seller-mypage.js가 제어한다. -->
          <div id="products-status" class="product-status" role="status" hidden></div>

          <ul id="products-list" class="mypage-list"></ul>
        </section>

        <!-- 공구 참여 현황 -->
        <section id="tab-teams" class="mypage-section mypage-tab-panel" role="tabpanel" aria-labelledby="tab-btn-teams" data-tab-panel="teams">
          <div class="section__head">
            <h2>공구 참여 현황</h2>
          </div>

          <div id="teams-status" class="product-status" role="status" hidden></div>

          <ul id="teams-list" class="mypage-list"></ul>
        </section>

        <!-- 환불 요청 관리 -->
        <section id="tab-refunds" class="mypage-section mypage-tab-panel" role="tabpanel" aria-labelledby="tab-btn-refunds" data-tab-panel="refunds">
          <div class="section__head">
            <h2>환불 요청 관리</h2>
          </div>

          <div id="refund-requests-status" class="product-status" role="status" hidden></div>

          <ul id="refund-requests-list" class="mypage-list"></ul>
        </section>

        <!-- 계정 정보 수정 -->
        <section id="tab-account" class="mypage-section mypage-tab-panel" role="tabpanel" aria-labelledby="tab-btn-account" data-tab-panel="account">
          <div class="section__head">
            <h2>계정 정보</h2>
          </div>

          <!-- 저장 성공/실패 공통 안내. js/account-info.js가 제어한다. -->
          <div id="account-info-alert" class="form-alert" role="alert" hidden></div>

          <form id="account-info-form" novalidate>
            <div class="form-group">
              <label class="form-label" for="account-name">이름</label>
              <input class="form-input" type="text" id="account-name" name="name" autocomplete="name" />
            </div>

            <div class="form-group">
              <label class="form-label" for="account-email">이메일</label>
              <input class="form-input" type="email" id="account-email" name="email" autocomplete="email" />
              <!-- DUPLICATE_EMAIL 안내. js/account-info.js가 제어한다. -->
              <p id="account-email-error" class="form-error" role="alert" hidden></p>
            </div>

            <button type="submit" id="account-info-submit" class="btn btn-primary">저장</button>
          </form>
        </section>
      </div>
    </section>
  </main>

  <div data-include="footer"></div>
  <div data-include="chat-widget"></div>
  <div data-include="support-widget"></div>

  <script src="/js/include.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/header-auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
  <script src="/js/support-chat-client.js"></script>
  <script src="/js/support-widget.js"></script>
  <script src="/js/header-search.js"></script>
  <script src="/js/header-notifications.js"></script>
  <script src="/js/header-wishlist-badge.js"></script>
  <script src="/js/chat-widget.js"></script>
  <script src="/js/account-info.js"></script>
  <script src="/js/seller-mypage.js"></script>
</body>
</html>
