<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 파비콘 — 배경 없이 로고의 너구리 마크를 브랜드 그라데이션으로 그린다(헤더 로고와 같은 표현).
       크기마다 그림이 다르다: 16px는 선이 사라지고 밝은 탭바에서 안 보여서 채운 얼굴을,
       32/48px는 얼굴 아웃라인을, 180px(홈화면)는 꼬리까지 있는 로고 원형을 쓴다(2026-08-20).
       하위 디렉터리 페이지도 있어 경로는 절대경로다. -->
  <link rel="icon" href="/images/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/images/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/images/favicon-180.png" />
  <title>페이지를 찾을 수 없습니다 — GONG9RI</title>
  <!-- 검색엔진이 이 페이지를 색인하지 않도록 한다(에러 페이지가 검색 결과에 뜨면 안 된다). -->
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
  />

  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div data-include="header"></div>

  <main>
    <!--
      브라우저로 들어온 요청이 404(없는 페이지) 또는 401(인증 필요)일 때 보여주는 페이지다.
      두 경우를 한 페이지로 합친 이유 — 서버 입장에서 "없는 주소"와 "권한이 없어 못 보는 주소"를
      구분해서 알려주면 어떤 경로가 실재하는지 외부에 알려주는 셈이 된다(경로 존재 여부 노출).
      그래서 문구도 두 가능성을 함께 안내한다. 예전에는 이 상황에서 사용자가 브라우저 화면에
      {"success":false,"code":"UNAUTHORIZED","message":"로그인이 필요합니다."} 같은 날 JSON을
      그대로 봤고, 오타로 들어온 사람에게는 "로그인이 필요합니다"가 틀린 안내였다(2026-08-20 수정).
    -->
    <section class="section container">
      <div class="error-page">
        <p class="error-page__code">404</p>
        <h1 class="error-page__title">페이지를 찾을 수 없습니다</h1>
        <p class="error-page__desc">
          주소가 잘못되었거나, 로그인이 필요한 페이지일 수 있어요.<br />
          주소를 다시 확인해 주세요.
        </p>
        <div class="error-page__actions">
          <a href="/" class="btn btn-primary">메인으로 가기</a>
          <a href="/login.html" class="btn btn-secondary">로그인</a>
        </div>
      </div>
    </section>
  </main>

  <div data-include="footer"></div>

  <script src="/js/include.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/header-auth.js"></script>
  <script src="/js/header-search.js"></script>
  <script src="/js/header-notifications.js"></script>
  <script src="/js/header-wishlist-badge.js"></script>
</body>
</html>
