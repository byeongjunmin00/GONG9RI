<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 파비콘 — 헤더 로고의 너구리 마크를 배경 없이 그대로 쓴다(꼬리까지, 브랜드 그라데이션).
       크기별로 선 굵기만 다르다: 작게 줄일수록 원본 아웃라인이 픽셀보다 얇아져 사라지기 때문.
       16px에서는 그래도 뭉개지는데, 요즘 디스플레이는 16px 자리에도 32px를 가져가므로
       실사용에서는 대부분 또렷한 쪽을 보게 된다(2026-08-20).
       하위 디렉터리 페이지도 있어 경로는 절대경로다. -->
  <link rel="icon" href="/images/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/images/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/images/favicon-180.png" />
  <title>로그인 — GONG9RI</title>

  <!-- 폰트: 헤딩 - Poppins(Google Fonts CDN), 본문 - Pretendard(jsdelivr CDN) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
  />

  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div data-include="header"></div>

  <main>
    <section class="section container">
      <div style="max-width: 420px; margin: 0 auto;">
        <div class="section__head" style="text-align: center;">
          <h1><span class="text-gradient">로그인</span></h1>
          <p class="text-muted" style="margin-top: var(--space-2);">GONG9RI에서 함께 사면 더 저렴해요.</p>
        </div>

        <!-- 로그인 실패 안내 / 회원가입 완료 안내. js/login.js가 텍스트와 표시 여부를 제어한다. -->
        <div id="form-alert" class="form-alert" role="alert" hidden>
          <span id="form-alert-text"></span>
          <!-- EMAIL_NOT_VERIFIED일 때만 노출 — js/login.js가 제어한다. -->
          <button type="button" id="resend-verification-btn" class="btn btn-secondary btn-sm" style="margin-top: var(--space-2);" hidden>인증 메일 다시 보내기</button>
        </div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="username">아이디</label>
            <input
              class="form-input"
              type="text"
              id="username"
              name="username"
              autocomplete="username"
              placeholder="아이디를 입력하세요"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">비밀번호</label>
            <input
              class="form-input"
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="비밀번호를 입력하세요"
            />
          </div>

          <button type="submit" id="login-submit" class="btn btn-primary btn-block">로그인</button>
        </form>

        <p class="text-muted" style="margin: var(--space-3) 0; text-align: center; font-size: var(--fs-sm);">또는</p>

        <!-- 카카오 로그인 — 전체 페이지 리다이렉트 흐름이라 별도 JS 없이 링크로 충분하다(js/login.js 참고). -->
        <a href="/api/auth/kakao/login" class="btn btn-block"
           style="background: #FEE500; color: #191919; border: none;">카카오로 로그인</a>

        <p class="text-muted" style="margin-top: var(--space-3); text-align: center; font-size: var(--fs-sm);">
          <a href="/forgot-password.html">비밀번호를 잊으셨나요?</a>
        </p>

        <p class="text-muted" style="margin-top: var(--space-2); text-align: center; font-size: var(--fs-sm);">
          아직 계정이 없으신가요? <a href="/signup.html">회원가입</a>
        </p>
      </div>
    </section>
  </main>

  <div data-include="footer"></div>
  <div data-include="chat-widget"></div>
  <div data-include="support-widget"></div>

  <script src="/js/include.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/header-auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
  <script src="/js/support-chat-client.js"></script>
  <script src="/js/support-widget.js"></script>
  <script src="/js/header-search.js"></script>
  <script src="/js/header-notifications.js"></script>
  <script src="/js/header-wishlist-badge.js"></script>
  <script src="/js/chat-widget.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
