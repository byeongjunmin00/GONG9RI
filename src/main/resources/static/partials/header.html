<!--
  header.html — 공통 헤더 partial
  js/include.js가 fetch로 이 파일을 가져와 data-include="header" 컨테이너에 삽입한다.
  * 헤더 로그인 상태가 연동되어 있다(js/header-auth.js, docs/dev/frontend/header-auth/design.md).
    include.js가 삽입 완료 시 발행하는 'gong9ri:includes-ready' 이벤트를 header-auth.js가 구독해
    GET /api/auth/me를 호출하고, 성공(로그인 상태)이면 #header-auth-guest를 숨기고
    #header-auth-user를 보여주며(사용자 이름 표시 + 로그아웃 버튼), 실패(401 등)면 아래
    비로그인 마크업을 그대로 유지한다.
  * nav 링크(판매 물품 등록/판매자 마이페이지/구매자 마이페이지)는 로그인 상태·역할에 따라
    숨김/노출된다 — 기본값은 `hidden`이며, header-auth.js가 로그인한 역할과 일치하는
    `data-role` 링크만 `hidden = false`로 노출한다. 별도 "메인" nav 링크는 없다 — 로고
    자체가 이미 `/`로 가는 링크라 중복이고, 역할 링크가 전부 숨겨진 상태(비로그인 등)에서
    "메인" 하나만 덩그러니 남는 게 어색해 제거했다.
    각 페이지 자체의 접근 제어(비로그인으로 URL 직접 접근 시 등)는 이 헤더 표시와 무관하게
    서버 401/403 사후 판정으로 그대로 유지된다.
  * 로그인(`/login.html`)·회원가입(`/signup.html`) 링크는 실제 페이지가 만들어졌다(frontend/auth 작업).
    "판매 물품 등록"(`/seller/products/new.html`)도 실제 페이지가 만들어졌다(frontend/seller-product-new 작업).
    "판매자 마이페이지"(`/seller/mypage.html`)도 실제 페이지가 만들어졌다(frontend/seller-mypage 작업).
    "구매자 마이페이지"(`/buyer/mypage.html`)도 실제 페이지가 만들어졌다(frontend/buyer-mypage 작업).
    이 페이지들은 서브디렉토리에 있어 SecurityConfig의 정적 리소스 permitAll 매처에
    "/**/*.html"이 추가돼 있어야 비로그인 상태에서도 정상 렌더링된다.
-->
<header class="site-header">
  <div class="container site-header__inner">
    <!-- 로고 아이콘(라쿤이 몸을 만 모양 = 숫자 "9")을 워드마크의 "9" 자리에 그대로 끼워 넣는다
         (별도 좌측 아이콘 제거, 2026-08-20 사용자와 시안 검토 후 확정 — D안: 글자를 살짝 키우고
         로고는 그보다 더 크게 잡아 귀가 살짝 위로 튀어나오게). 아이콘은 <img>가 아니라 배경을
         --gradient-brand로 채우고 PNG 알파로 마스킹한 span이라, 실제 대체텍스트는 옆의
         .visually-hidden "9"가 담당하고 아이콘 자체는 aria-hidden으로 건너뛴다
         (스크린리더는 "GONG" + "9" + "RI" 순서로 그대로 읽는다). -->
    <a href="/" class="site-header__logo">
      <span class="site-header__wordmark">GONG<span class="site-header__wordmark-mark" aria-hidden="true"></span><span class="visually-hidden">9</span>RI</span>
    </a>

    <div class="site-header__search">
      <form id="header-search-form" class="search-bar" role="search" autocomplete="off">
        <input
          type="search"
          id="header-search-input"
          class="search-bar__input"
          placeholder="상품명이나 판매자 이름으로 검색해보세요"
          aria-label="상품 검색"
        />
        <button type="submit" class="search-bar__btn" aria-label="검색">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="6.5" stroke="currentColor" stroke-width="2" />
            <line x1="13.4" y1="13.4" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </form>

      <!-- 실시간 인기 검색어 슬라이드(product/search-trends) — 한 번에 하나씩 순위가 자동으로
           바뀌는 티커. 클릭하면 아래 통합 검색 오버레이(#header-search-trends-panel)를 연다
           (같은 데이터를 한 번만 불러와 재사용, js/header-search.js). 검색어를 10자로 잘라서
           표시하므로(js/header-search.js) 별도 고정폭 예약 없이 내용 길이만큼만 차지한다. -->
      <button
        type="button"
        id="header-search-trends-ticker"
        class="header-search-trends-ticker"
        aria-label="실시간 인기 검색어 더 보기"
        hidden
      ></button>

      <!-- 통합 검색 오버레이 — 검색창 포커스/클릭 시 열린다(js/header-search.js). 최근 검색어(로그인
           무관, 브라우저 localStorage 기준) → 카테고리 바로가기 → 실시간 인기 검색어 순으로 3개 섹션.
           최근검색어/카테고리는 API 없이 즉시 렌더링, 인기 검색어만 최초 오픈 시 1회 로드해서 재사용한다. -->
      <div id="header-search-trends-panel" class="header-search-overlay" hidden>
        <section class="header-search-overlay__section">
          <div class="header-search-overlay__section-head">
            <p class="header-search-overlay__label">최근 검색어</p>
            <button type="button" id="header-search-recent-clear" class="header-search-overlay__clear" hidden>전체삭제</button>
          </div>
          <ul id="header-search-recent-list" class="header-search-recent__list"></ul>
        </section>

        <section class="header-search-overlay__section">
          <p class="header-search-overlay__label">카테고리</p>
          <ul id="header-search-category-list" class="header-search-overlay__category-list"></ul>
        </section>

        <section class="header-search-overlay__section">
          <div class="header-search-overlay__section-head">
            <p class="header-search-overlay__label">실시간 인기 검색어</p>
            <!-- 검색어 집계는 실시간(Redis, product/search-trends)이지만, 화면에 뜬 이 순위 자체는
                 방금 불러온 시점 스냅샷이라 "몇 시 기준"인지 명시한다 — js/header-search.js가 채운다. -->
            <p id="header-search-trends-updated" class="header-search-trends__updated"></p>
          </div>
          <ol id="header-search-trends-list" class="header-search-trends__list"></ol>
        </section>

        <div class="header-search-overlay__footer">
          <button type="button" id="header-search-overlay-close" class="header-search-overlay__close">닫기</button>
        </div>
      </div>
    </div>

    <div class="site-header__right">
      <nav class="site-header__nav" aria-label="주요 메뉴">
        <a href="/seller/products/new.html" data-role="SELLER" hidden>판매 물품 등록</a>
        <a href="/seller/mypage.html" data-role="SELLER" hidden>판매자 마이페이지</a>
        <a href="/buyer/mypage.html" data-role="BUYER" hidden>구매자 마이페이지</a>
        <!-- 찜(product/wishlist) 지름길 — 구매자 마이페이지의 "찜한 상품" 섹션(#wishlist-section)으로
             바로 이동. 노출 자체는 다른 nav 링크와 동일하게 header-auth.js의 data-role 매칭을 쓰고,
             옆의 숫자 뱃지(몇 개 찜했는지)만 알림 벨과 같은 패턴(gong9ri:auth-resolved 구독)으로
             js/header-wishlist-badge.js가 별도로 채운다 — 목록 자체를 드롭다운으로 또 만들지는 않기로
             함(찜 목록은 이미지·가격 등 정보가 많아 마이페이지의 카드형 목록이 더 적합하다는 판단,
             2026-08-19 사용자와 논의). -->
        <a href="/buyer/mypage.html#wishlist-section" class="site-header__wishlist-link" data-role="BUYER" hidden aria-label="찜한 상품">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 21s-7.5-4.6-10.2-9.1C.1 8.8 1.4 5 5 4.2c2.1-.5 4.1.4 5.2 2.1a.9.9 0 0 0 1.6 0C13 4.6 15 3.7 17.1 4.2c3.5.8 4.9 4.6 3.1 7.7C19.5 16.4 12 21 12 21z"/></svg>
          <span id="header-wishlist-badge" class="site-header__wishlist-badge" hidden></span>
        </a>
        <a href="/admin/dashboard.html" data-role="ADMIN" hidden>관리자 대시보드</a>
      </nav>

      <!-- 알림 벨 — 구매자/판매자 둘 다 쓰는 기능이라(GET/POST /api/{buyer,seller}/mypage/notifications*)
           위 nav의 data-role 매칭 방식(역할별로 다른 링크 하나씩 노출) 대신, 로그인 여부만으로 노출을
           결정하는 별도 스크립트(js/header-notifications.js)가 담당한다. 그래서 .site-header__nav
           바깥에 둔다. -->
      <div class="site-header__notifications" id="header-notifications" hidden>
        <button type="button" id="header-notifications-bell" class="site-header__notifications-bell" aria-label="알림">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0-6 6v3.3c0 .6-.2 1.2-.6 1.7L4 16h16l-1.4-2c-.4-.5-.6-1.1-.6-1.7V9a6 6 0 0 0-6-6z" />
            <path d="M9.5 19a2.5 2.5 0 0 0 5 0" />
          </svg>
          <span id="header-notifications-badge" class="site-header__notifications-badge" hidden></span>
        </button>

        <div id="header-notifications-panel" class="header-notifications-panel" hidden>
          <div class="header-notifications-panel__head">
            <p class="header-notifications-panel__title">알림</p>
            <button type="button" id="header-notifications-mark-all" class="header-notifications-panel__mark-all" hidden>모두 읽음</button>
          </div>
          <ul id="header-notifications-list" class="header-notifications-panel__list"></ul>
          <!-- 알림 종류가 9종이 되면서 목록이 길어질 수 있어 한 번에 다 내리지 않는다(2026-08-20).
               상품 목록의 "더 보기"와 같은 패턴 — 무한 스크롤 대신 버튼으로 통일한다. -->
          <button type="button" id="header-notifications-more" class="header-notifications-panel__more" hidden>더 보기</button>
        </div>
      </div>

      <div class="site-header__auth" id="header-auth-guest">
        <!-- 로그인/회원가입 버튼 하나로 통합 — 로그인 페이지(login.html) 하단에 이미
             "회원가입" 링크가 있어(login.html:84), 별도 회원가입 버튼 없이도 진입 가능하다. -->
        <a href="/login.html" class="btn btn-primary btn-sm">로그인/회원가입</a>
      </div>

      <div class="site-header__auth" id="header-auth-user" hidden>
        <span class="header-auth-user__name" id="header-auth-user-name"></span>
        <button type="button" class="btn btn-secondary btn-sm" id="header-auth-logout">로그아웃</button>
      </div>
    </div>
  </div>
</header>
