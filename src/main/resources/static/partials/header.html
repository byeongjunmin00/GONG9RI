<!--
  header.html — 공통 헤더 partial
  js/include.js가 fetch로 이 파일을 가져와 data-include="header" 컨테이너에 삽입한다.
  * 헤더 로그인 상태가 연동되어 있다(js/header-auth.js, docs/dev/frontend/header-auth/design.md).
    include.js가 삽입 완료 시 발행하는 'gong9ri:includes-ready' 이벤트를 header-auth.js가 구독해
    GET /api/auth/me를 호출하고, 성공(로그인 상태)이면 #header-auth-guest를 숨기고
    #header-auth-user를 보여주며(사용자 이름 표시 + 로그아웃 버튼), 실패(401 등)면 아래
    비로그인 마크업을 그대로 유지한다.
  * nav 링크(판매 물품 등록/판매자 마이페이지/구매자 마이페이지)는 로그인 상태·역할에 따라
    숨김/노출된다 — 기본값은 `hidden`이며, header-auth.js가 로그인한 역할과 일치하는
    `data-role` 링크만 `hidden = false`로 노출한다. 별도 "메인" nav 링크는 없다 — 로고
    자체가 이미 `/`로 가는 링크라 중복이고, 역할 링크가 전부 숨겨진 상태(비로그인 등)에서
    "메인" 하나만 덩그러니 남는 게 어색해 제거했다.
    각 페이지 자체의 접근 제어(비로그인으로 URL 직접 접근 시 등)는 이 헤더 표시와 무관하게
    서버 401/403 사후 판정으로 그대로 유지된다.
  * 로그인(`/login.html`)·회원가입(`/signup.html`) 링크는 실제 페이지가 만들어졌다(frontend/auth 작업).
    "판매 물품 등록"(`/seller/products/new.html`)도 실제 페이지가 만들어졌다(frontend/seller-product-new 작업).
    "판매자 마이페이지"(`/seller/mypage.html`)도 실제 페이지가 만들어졌다(frontend/seller-mypage 작업).
    "구매자 마이페이지"(`/buyer/mypage.html`)도 실제 페이지가 만들어졌다(frontend/buyer-mypage 작업).
    이 페이지들은 서브디렉토리에 있어 SecurityConfig의 정적 리소스 permitAll 매처에
    "/**/*.html"이 추가돼 있어야 비로그인 상태에서도 정상 렌더링된다.
-->
<header class="site-header">
  <div class="container site-header__inner">
    <a href="/" class="site-header__logo">
      GONG<span class="text-gradient">9</span>RI
    </a>

    <nav class="site-header__nav" aria-label="주요 메뉴">
      <a href="/seller/products/new.html" data-role="SELLER" hidden>판매 물품 등록</a>
      <a href="/seller/mypage.html" data-role="SELLER" hidden>판매자 마이페이지</a>
      <a href="/buyer/mypage.html" data-role="BUYER" hidden>구매자 마이페이지</a>
      <a href="/admin/dashboard.html" data-role="ADMIN" hidden>관리자 대시보드</a>
    </nav>

    <div class="site-header__auth" id="header-auth-guest">
      <a href="/login.html" class="btn btn-secondary btn-sm">로그인</a>
      <a href="/signup.html" class="btn btn-primary btn-sm">회원가입</a>
    </div>

    <div class="site-header__auth" id="header-auth-user" hidden>
      <span class="header-auth-user__name" id="header-auth-user-name"></span>
      <button type="button" class="btn btn-secondary btn-sm" id="header-auth-logout">로그아웃</button>
    </div>
  </div>
</header>
