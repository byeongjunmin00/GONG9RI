<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 파비콘 — 헤더 로고의 너구리 마크를 배경 없이 그대로 쓴다(꼬리까지, 브랜드 그라데이션).
       크기별로 선 굵기만 다르다: 작게 줄일수록 원본 아웃라인이 픽셀보다 얇아져 사라지기 때문.
       16px에서는 그래도 뭉개지는데, 요즘 디스플레이는 16px 자리에도 32px를 가져가므로
       실사용에서는 대부분 또렷한 쪽을 보게 된다(2026-08-20).
       하위 디렉터리 페이지도 있어 경로는 절대경로다. -->
  <link rel="icon" href="/images/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/images/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/images/favicon-180.png" />
  <title>비밀번호 재설정 — GONG9RI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
  />

  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div data-include="header"></div>

  <main>
    <section class="section container">
      <div style="max-width: 420px; margin: 0 auto;">
        <div class="section__head" style="text-align: center;">
          <h1><span class="text-gradient">비밀번호 재설정</span></h1>
          <p class="text-muted" style="margin-top: var(--space-2);">새 비밀번호를 입력해주세요.</p>
        </div>

        <!-- 재설정 실패/성공 안내. js/reset-password.js가 텍스트와 표시 여부를 제어한다. -->
        <div id="form-alert" class="form-alert" role="alert" hidden></div>

        <!-- URL에 토큰이 없으면 js가 이 폼 자체를 숨기고 안내만 보여준다. -->
        <form id="reset-password-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="new-password">새 비밀번호</label>
            <input
              class="form-input"
              type="password"
              id="new-password"
              name="newPassword"
              autocomplete="new-password"
              placeholder="새 비밀번호를 입력하세요"
            />
          </div>

          <button type="submit" id="reset-password-submit" class="btn btn-primary btn-block">비밀번호 변경</button>
        </form>

        <p class="text-muted" style="margin-top: var(--space-5); text-align: center; font-size: var(--fs-sm);">
          <a href="/login.html">로그인으로 돌아가기</a>
        </p>
      </div>
    </section>
  </main>

  <div data-include="footer"></div>
  <div data-include="chat-widget"></div>

  <script src="/js/include.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/header-auth.js"></script>
  <script src="/js/header-search.js"></script>
  <script src="/js/header-notifications.js"></script>
  <script src="/js/header-wishlist-badge.js"></script>
  <script src="/js/chat-widget.js"></script>
  <script src="/js/reset-password.js"></script>
</body>
</html>
