<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 찾기 — GONG9RI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
  />

  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div data-include="header"></div>

  <main>
    <section class="section container">
      <div style="max-width: 420px; margin: 0 auto;">
        <div class="section__head" style="text-align: center;">
          <h1><span class="text-gradient">비밀번호 찾기</span></h1>
          <p class="text-muted" style="margin-top: var(--space-2);">
            가입할 때 쓴 이메일을 입력하면 재설정 링크를 보내드려요.
          </p>
        </div>

        <!-- 요청 결과 안내. js/forgot-password.js가 텍스트와 표시 여부를 제어한다. -->
        <div id="form-alert" class="form-alert" role="alert" hidden></div>

        <form id="forgot-password-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">이메일</label>
            <input
              class="form-input"
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              placeholder="가입할 때 쓴 이메일을 입력하세요"
            />
          </div>

          <button type="submit" id="forgot-password-submit" class="btn btn-primary btn-block">재설정 링크 보내기</button>
        </form>

        <p class="text-muted" style="margin-top: var(--space-5); text-align: center; font-size: var(--fs-sm);">
          <a href="/login.html">로그인으로 돌아가기</a>
        </p>
      </div>
    </section>
  </main>

  <div data-include="footer"></div>
  <div data-include="chat-widget"></div>

  <script src="/js/include.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/header-auth.js"></script>
  <script src="/js/chat-widget.js"></script>
  <script src="/js/search-popup.js"></script>
  <script src="/js/forgot-password.js"></script>
</body>
</html>
