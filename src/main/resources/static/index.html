<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GONG9RI — 함께 사면 더 저렴하게</title>
  <meta name="description" content="GONG9RI(공9리) — 참여자가 많아질수록 가격이 계단식으로 내려가는 공동구매 플랫폼. 혼자 구매하거나 공구팀을 만들어 함께 더 저렴하게 구매해보세요." />
  <link rel="canonical" href="https://gong9ri-production.up.railway.app/" />

  <!-- Open Graph — 카카오톡 공유하기 버튼(product.js)과 별개로, 이 링크를 아무 데나(슬랙/디스코드/문자 등)
       그냥 붙여넣기만 해도 미리보기 카드가 뜨게 하는 범용 태그. 다른 정적 페이지들도 같은 서버가 그대로
       서빙하는 정적 HTML이라 페이지별로 동적으로 채울 방법이 없어 홈페이지 기준 값으로 고정한다 —
       상품 상세 페이지별 카드는 이미 카카오 공유 버튼(product.js)이 그 페이지에 한해 동적으로 만들어준다. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="GONG9RI" />
  <meta property="og:title" content="GONG9RI — 함께 사면 더 저렴하게" />
  <meta property="og:description" content="참여자가 많아질수록 가격이 계단식으로 내려가는 공동구매 플랫폼. 혼자 구매하거나 공구팀을 만들어 함께 더 저렴하게 구매해보세요." />
  <meta property="og:url" content="https://gong9ri-production.up.railway.app/" />
  <meta property="og:image" content="https://gong9ri-production.up.railway.app/images/logo-icon.png" />
  <meta name="twitter:card" content="summary" />

  <!-- 폰트: 헤딩 - Poppins(Google Fonts CDN), 본문 - Pretendard(jsdelivr CDN) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
  />

  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div data-include="header"></div>

  <main>
    <section class="section container">
      <!-- 카카오 로그인 role 불일치 안내(?kakaoRoleMismatch=BUYER|SELLER). js/main.js가 표시 여부를 제어한다. -->
      <div id="page-alert" class="form-alert form-alert--success" role="alert" hidden>
        <span id="page-alert-text"></span>
      </div>

      <!-- 상품명/판매자명 검색 — ?keyword= 쿼리파라미터로 목록을 다시 불러온다(js/main.js, product/list-search).
           검색 UI 자체는 헤더(partials/header.html의 #header-search-form, js/header-search.js)로
           옮겼다. 이 폼은 main.js가 요소 존재를 전제로 동작해서(getElementById 가드) DOM에는 남기되,
           화면에는 안 보이게 인라인 스타일로 숨긴다 — main.js 로직은 건드리지 않는다. -->
      <form id="search-form" class="search-bar" role="search" style="display:none;">
        <input
          type="search"
          id="search-input"
          class="search-bar__input"
          placeholder="상품명이나 판매자 이름으로 검색해보세요"
          aria-label="상품 검색"
        />
        <button type="submit" class="search-bar__btn" aria-label="검색">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="6.5" stroke="currentColor" stroke-width="2" />
            <line x1="13.4" y1="13.4" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </form>

      <!-- 메인 히어로 캐러셀 — 3장. 1번은 고정 소개, 2번(실시간 인기 공구)은 js/main.js가 인기순 1위
           상품 이미지/이름/참여인원/가격으로 채우고(없으면 기본 문구 유지, 가짜 데이터 금지),
           3번은 고정 마케팅 문구. 전 슬라이드 공통으로 배경 풀블리드 + 흰 글씨 + 하단 그라디언트
           스크림. translateX로 왼쪽으로 넘어가는 자동 슬라이드 + 점 클릭. js/main.js가 제어한다. -->
      <div id="hero-carousel" class="hero-carousel">
        <div id="hero-carousel-track" class="hero-carousel-track">
          <a href="#product-grid" class="hero-carousel-slide hero-carousel-slide--intro">
            <div class="hero-carousel-slide__content">
              <p class="hero-carousel-slide__kicker">같이 사면, 더 싸니까</p>
              <h1 class="hero-carousel-slide__title">사람이 모일수록 더 저렴해지는 공동구매</h1>
              <p class="hero-carousel-slide__desc">
                GONG9RI에서 함께 사고, 더 좋은 가격을 만나보세요.
              </p>
            </div>
          </a>

          <a id="hero-carousel-popular-slide" href="#product-grid" class="hero-carousel-slide hero-carousel-slide--popular">
            <img id="hero-carousel-popular-image" class="hero-carousel-slide__bg-image" alt="" hidden />
            <div class="hero-carousel-slide__content">
              <p class="hero-carousel-slide__kicker">🔥 실시간 인기 공구</p>
              <h2 id="hero-carousel-popular-title" class="hero-carousel-slide__title">지금 가장 많이 모인 상품 보러가기</h2>
              <p id="hero-carousel-popular-desc" class="hero-carousel-slide__desc" hidden></p>
            </div>
          </a>

          <a href="/api/auth/kakao/login" class="hero-carousel-slide hero-carousel-slide--signup">
            <img src="/images/kakaofriends.webp" alt="" class="hero-carousel-slide__bg-image hero-carousel-slide__bg-image--contain" />
            <div class="hero-carousel-slide__content">
              <p class="hero-carousel-slide__kicker">🎉 신규 가입하면</p>
              <h2 class="hero-carousel-slide__title">카카오톡으로 3초만에 시작</h2>
            </div>
          </a>
        </div>
        <div id="hero-carousel-dots" class="hero-carousel-dots"></div>
      </div>

      <!-- 카테고리 바 + 정렬 — 클릭/선택 시 ?category=, ?sort= 쿼리파라미터로 목록을 다시 불러온다(js/main.js). -->
      <div class="category-bar-row">
        <div id="category-bar" class="category-bar"></div>
        <select id="sort-select" class="sort-select">
          <option value="LATEST">최신순</option>
          <option value="POPULAR">인기순</option>
          <option value="DEADLINE">마감임박순</option>
        </select>
      </div>

      <!-- 로딩/빈 목록/에러 상태 안내. js/main.js가 텍스트와 표시 여부를 제어한다. -->
      <div id="product-status" class="product-status" role="status" hidden></div>

      <!-- 상품 카드가 js/main.js에 의해 이 컨테이너 안에 렌더링된다. -->
      <div id="product-grid" class="grid-cards"></div>

      <div class="load-more-wrap">
        <button type="button" id="load-more-btn" class="btn btn-secondary" hidden>더 보기</button>
      </div>
    </section>
  </main>

  <div data-include="footer"></div>
  <div data-include="chat-widget"></div>

  <script src="/js/include.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/header-auth.js"></script>
  <script src="/js/header-search.js"></script>
  <script src="/js/header-notifications.js"></script>
  <script src="/js/header-wishlist-badge.js"></script>
  <script src="/js/chat-widget.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
