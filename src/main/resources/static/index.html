<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GONG9RI — 함께 사면 더 저렴하게</title>

  <!-- 폰트: 헤딩 - Poppins(Google Fonts CDN), 본문 - Pretendard(jsdelivr CDN) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
  />

  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div data-include="header"></div>

  <main>
    <section class="section container">
      <!-- 카카오 로그인 role 불일치 안내(?kakaoRoleMismatch=BUYER|SELLER). js/main.js가 표시 여부를 제어한다. -->
      <div id="page-alert" class="form-alert form-alert--success" role="alert" hidden>
        <span id="page-alert-text"></span>
      </div>

      <div class="section__head">
        <p class="text-muted" style="font-weight:700; letter-spacing: 0.08em; text-transform: uppercase; font-size: var(--fs-xs);">Group Buy</p>
        <h1><span class="text-gradient">함께 사면</span> 더 저렴하게, GONG9RI</h1>
        <p class="text-muted" style="margin-top: var(--space-2); max-width: 640px;">
          지금 진행 중인 공동구매 상품을 둘러보세요. 참여자가 모일수록 1인당 가격이 낮아집니다.
        </p>
      </div>

      <!-- 로딩/빈 목록/에러 상태 안내. js/main.js가 텍스트와 표시 여부를 제어한다. -->
      <div id="product-status" class="product-status" role="status" hidden></div>

      <!-- 상품 카드가 js/main.js에 의해 이 컨테이너 안에 렌더링된다. -->
      <div id="product-grid" class="grid-cards"></div>

      <div class="load-more-wrap">
        <button type="button" id="load-more-btn" class="btn btn-secondary" hidden>더 보기</button>
      </div>
    </section>
  </main>

  <div data-include="footer"></div>
  <div data-include="chat-widget"></div>

  <script src="/js/include.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/header-auth.js"></script>
  <script src="/js/chat-widget.js"></script>
  <script src="/js/search-popup.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
