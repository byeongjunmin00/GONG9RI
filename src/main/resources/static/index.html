<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GONG9RI — 함께 사면 더 저렴하게</title>

  <!-- 폰트: 헤딩 - Poppins(Google Fonts CDN), 본문 - Pretendard(jsdelivr CDN) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
  />

  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div data-include="header"></div>

  <main>
    <section class="section container">
      <!-- 카카오 로그인 role 불일치 안내(?kakaoRoleMismatch=BUYER|SELLER). js/main.js가 표시 여부를 제어한다. -->
      <div id="page-alert" class="form-alert form-alert--success" role="alert" hidden>
        <span id="page-alert-text"></span>
      </div>

      <!-- 상품명/판매자명 검색 — ?keyword= 쿼리파라미터로 목록을 다시 불러온다(js/main.js, product/list-search).
           검색 UI 자체는 헤더(partials/header.html의 #header-search-form, js/header-search.js)로
           옮겼다. 이 폼은 main.js가 요소 존재를 전제로 동작해서(getElementById 가드) DOM에는 남기되,
           화면에는 안 보이게 인라인 스타일로 숨긴다 — main.js 로직은 건드리지 않는다. -->
      <form id="search-form" class="search-bar" role="search" style="display:none;">
        <input
          type="search"
          id="search-input"
          class="search-bar__input"
          placeholder="상품명이나 판매자 이름으로 검색해보세요"
          aria-label="상품 검색"
        />
        <button type="submit" class="search-bar__btn" aria-label="검색">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="6.5" stroke="currentColor" stroke-width="2" />
            <line x1="13.4" y1="13.4" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </form>

      <!-- 광고 배너 — 슬림 공지 바(프론트 전용, 백엔드 연동 없음). 자동 순환 + 점 클릭. js/main.js가 제어한다. -->
      <div id="promo-bar" class="promo-bar">
        <div id="promo-bar-track" class="promo-bar-track"></div>
        <div id="promo-bar-dots" class="promo-bar-dots"></div>
        <a id="promo-bar-cta" href="#product-grid" class="promo-bar-cta">자세히 보기 →</a>
      </div>

      <div class="section__head">
        <p class="text-muted" style="font-weight:700; letter-spacing: 0.08em; text-transform: uppercase; font-size: var(--fs-xs);">Group Buy</p>
        <h1><span class="text-gradient">함께 사면</span> 더 저렴하게, GONG9RI</h1>
        <p class="text-muted" style="margin-top: var(--space-2); max-width: 640px;">
          지금 진행 중인 공동구매 상품을 둘러보세요. 참여자가 모일수록 1인당 가격이 낮아집니다.
        </p>
      </div>

      <!-- 카테고리 바 + 정렬 — 클릭/선택 시 ?category=, ?sort= 쿼리파라미터로 목록을 다시 불러온다(js/main.js). -->
      <div class="category-bar-row">
        <div id="category-bar" class="category-bar"></div>
        <select id="sort-select" class="sort-select">
          <option value="LATEST">최신순</option>
          <option value="POPULAR">인기순</option>
          <option value="DEADLINE">마감임박순</option>
        </select>
      </div>

      <!-- 로딩/빈 목록/에러 상태 안내. js/main.js가 텍스트와 표시 여부를 제어한다. -->
      <div id="product-status" class="product-status" role="status" hidden></div>

      <!-- 상품 카드가 js/main.js에 의해 이 컨테이너 안에 렌더링된다. -->
      <div id="product-grid" class="grid-cards"></div>

      <div class="load-more-wrap">
        <button type="button" id="load-more-btn" class="btn btn-secondary" hidden>더 보기</button>
      </div>
    </section>
  </main>

  <div data-include="footer"></div>
  <div data-include="chat-widget"></div>

  <script src="/js/include.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/header-auth.js"></script>
  <script src="/js/header-search.js"></script>
  <script src="/js/chat-widget.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
