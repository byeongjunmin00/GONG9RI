<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>구매자 마이페이지 — GONG9RI</title>

  <!-- 폰트: 헤딩 - Poppins(Google Fonts CDN), 본문 - Pretendard(jsdelivr CDN) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
  />

  <!-- 서브디렉토리(/buyer/)에 있는 페이지라 CSS/JS/partial 참조는 반드시 절대경로로 쓴다. -->
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div data-include="header"></div>

  <main>
    <section class="section container">
      <div class="section__head">
        <h1><span class="text-gradient">구매자 마이페이지</span></h1>
      </div>

      <!-- 401 로그인 필요 안내(두 API 중 하나라도 401이면 표시하고 아래 섹션 전체를 숨긴다). -->
      <div id="page-alert" class="form-alert" role="alert" hidden>
        <span id="page-alert-text"></span>
        <a id="page-alert-login-link" href="/login.html" hidden>로그인하기</a>
      </div>

      <div id="mypage-sections">
        <!-- 구매 목록 -->
        <section class="mypage-section">
          <div class="section__head">
            <h2>구매 목록</h2>
          </div>

          <!-- 로딩/빈 목록/에러(403 등) 상태. js/buyer-mypage.js가 제어한다. -->
          <div id="purchases-status" class="product-status" role="status" hidden></div>

          <ul id="purchases-list" class="mypage-list"></ul>
        </section>

        <!-- 공구 참여 목록 -->
        <section class="mypage-section">
          <div class="section__head">
            <h2>공구 참여 목록</h2>
          </div>

          <div id="teams-status" class="product-status" role="status" hidden></div>

          <ul id="teams-list" class="mypage-list"></ul>
        </section>
      </div>
    </section>
  </main>

  <div data-include="footer"></div>
  <div data-include="chat-widget"></div>

  <script src="/js/include.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/header-auth.js"></script>
  <script src="/js/chat-widget.js"></script>
  <script src="/js/buyer-mypage.js"></script>
</body>
</html>
