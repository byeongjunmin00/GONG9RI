server:
  port: ${PORT:8080}
  # Railway가 TLS를 프록시(엣지)에서 종료하고 내부로는 HTTP로 전달해서, 이 설정 없이는 Spring이 실제
  # HTTPS 요청도 "HTTP 요청"으로 인식했다 — Spring Security의 HSTS(항상 HTTPS로만 접속하게 강제하는
  # 헤더) 기본 작성기가 request.isSecure()==true일 때만 동작하는데, 그 조건을 못 맞춰서 HSTS 헤더가
  # 응답에 전혀 안 붙고 있었다(실측으로 확인, 2026-08-19). framework로 켜면 Spring Boot가
  # ForwardedHeaderFilter를 자동 등록해서 X-Forwarded-Proto(Railway 엣지가 실제로 https였다는 걸
  # 알려주는 헤더)를 신뢰하고 request.isSecure()를 정확히 판단한다 — Railway 같은 신뢰할 수 있는
  # 프록시 뒤에 있다는 전제는 이미 RateLimitFilter의 X-Forwarded-For 파싱에서도 똑같이 깔고 있다.
  forward-headers-strategy: framework
  tomcat:
    # 기본값 200 — 프로덕션 컨테이너 메모리 한도(1GB) 안에서 스레드 스택만으로 발생하는 non-heap
    # 점유를 줄이기 위해 낮춤(2026-08-13, 반복되는 OOM 크래시 대응). 스레드 하나당 기본 스택이
    # 대략 1MB라 200개면 최악의 경우 200MB까지 깔고 감 — 부트캠프 규모 트래픽 실측 부하테스트(k6,
    # VU 2970 근처에서야 무너짐)로는 50개면 충분하다고 판단(팀원 제안, docs/logs/cd/deploy 참고).
    threads:
      max: 50

spring:
  application:
    name: gong9ri
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gong9ri_db?serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      # 스프링 기본 상한이 파일 1MB / 요청 10MB라, 그대로 두면 휴대폰 사진(3~5MB) 업로드가 전부
      # 실패한다. 한 장 5MB까지 받아들이되 저장은 축소해서 한다(ProductImageStorage).
      # 요청 상한은 여러 장 동시 업로드를 감안해 넉넉히 잡는다.
      max-file-size: 5MB
      max-request-size: 30MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # Open-Session-In-View 끔(기본값 true) — 구매자 챗봇 SSE(동시성 버그 진단, docs/dev/ai/buyer-chatbot/
    # changes/002-*.md) 재현 중 실측으로 확인: OSIV가 켜져 있으면 각 SSE 요청이 "뷰 렌더링"이 끝날 때까지,
    # 즉 SseEmitter가 완료/타임아웃될 때까지(최대 EMITTER_TIMEOUT_MS) JDBC 커넥션 1개를 계속 붙들고
    # 있는다. 동시에 10개 요청을 보내면 HikariCP 기본 풀(10개)이 그 즉시 전부 소진되어, ChatLogRecorder의
    # REQUIRES_NEW 트랜잭션(실패 턴 기록)은 물론 이 챗봇과 무관한 다른 스케줄러(TeamDeadlineScheduler)
    # 까지 커넥션을 못 얻어 CannotCreateTransactionException으로 실패하는 걸 로컬 재현으로 직접 확인함.
    # 이 코드베이스는 REST API 전용(뷰 렌더링 없음)이고 컨트롤러가 엔티티를 직접 노출하지 않으며
    # (docs/code-convention.md), DTO 매핑이 전부 @Transactional 서비스 메서드 안에서 끝나므로 OSIV가
    # 필요 없다 — 꺼도 지연로딩 예외가 나지 않는다(전체 테스트로 회귀 없음 확인).
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cache:
    type: redis
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.3
          max-tokens: 500
gong9ri:
  chat:
    # 구매자 챗봇(BuyerChatService)의 두 타임아웃 — 기존에는 코드 상수였는데, 동시 요청 버그 진단
    # (docs/dev/ai/buyer-chatbot/changes/002-*.md) 중 테스트에서 실제 SseEmitter 타임아웃 경로를
    # 빠르게 검증할 필요가 있어 설정값으로 뺐다(테스트는 src/test/resources/application.yaml에서
    # 훨씬 짧은 값으로 오버라이드). llm-timeout-ms(LLM 응답 대기 상한)가 emitter-timeout-ms(SseEmitter
    # 자체 연결 유지 상한)보다 항상 충분히 짧아야 LLM_TIMEOUT의 폴백 안내가 정상적으로 먼저 발동한다.
    llm-timeout-ms: 15000
    emitter-timeout-ms: 60000

app:
  # 이메일 안의 인증/재설정 링크를 만들 때 쓰는 서버 공개 URL. Railway엔
  # APP_BASE_URL=https://gong9ri-production.up.railway.app 환경변수 추가 필요(docs/deploy-guide.md).
  base-url: ${APP_BASE_URL:http://localhost:8080}

  # 상품 이미지 업로드(product/image) 저장 위치. 프로덕션은 Railway 볼륨 마운트 경로를 환경변수로
  # 주입한다 — 컨테이너 파일시스템은 재배포 시 초기화되므로 볼륨 밖에 저장하면 업로드한 사진이
  # 사라진다. 로컬은 프로젝트 아래 uploads/(.gitignore 대상)를 쓴다.
  upload:
    dir: ${UPLOAD_DIR:./uploads}

sendgrid:
  # 이메일 인증/비밀번호 재설정 메일 발송(HTTP API). 처음엔 Gmail SMTP 직접 연결(JavaMailSender)을
  # 썼으나 Railway가 아웃바운드 SMTP(587번 포트)를 막고 있어 프로덕션에서 발송이 전혀 안 되는 걸
  # 실측으로 확인 후 HTTP(443) 기반인 SendGrid로 교체했다(docs/logs/cd/deploy/004-smtp-blocked.md).
  # from-email은 SendGrid 콘솔에서 Single Sender Verification으로 인증한 주소여야 한다(커스텀 도메인이
  # 없어 도메인 전체 인증 대신 이 방식을 씀).
  api-key: ${SENDGRID_API_KEY:}
  from-email: ${SENDGRID_FROM_EMAIL:}

kakao:
  # 로그인 고도화 3단계 — 카카오 로그인(Authorization Code, 수동 구현). 카카오 개발자 콘솔에서 발급받은
  # 값을 환경변수로 주입한다(레포에 실제 키를 두지 않는다, OPENAI_API_KEY와 같은 패턴). client-secret은
  # 콘솔에서 "보안"을 활성화했을 때만 필요 — 안 켰으면 빈 값이어도 됨.
  client-id: ${KAKAO_CLIENT_ID:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  # 카카오톡 공유하기(docs/dev/share/kakao-share/design.md) — 브라우저에서 실행되는 Kakao JS SDK 초기화용.
  # 도메인 화이트리스트(카카오 콘솔에 등록한 사이트 도메인)로 보호되는 공개 가능한 값이라 REST API
  # 키/client-secret과 달리 그대로 프론트에 내려줘도 되지만, 레포엔 두지 않고 환경변수로 주입한다.
  js-key: ${KAKAO_JS_KEY:}

team:
  # team/join 동시성 전략 비교용 토글: lock(비관적 락, 기본값) | atomic(조건부 UPDATE)
  # docs/logs/team/crud/003-atomic-comparison.md 참고
  join-strategy: lock

portone:
  # PortOne(구 아임포트) V2 API 연동(샌드박스/테스트 모드) — docs/dev/payment/portone/design.md.
  # 실제 값은 전부 환경변수로 주입한다(레포에 실제 키 값을 두지 않는다, OPENAI_API_KEY와 같은 패턴).
  store-id: ${PORTONE_STORE_ID:}
  channel-key: ${PORTONE_CHANNEL_KEY:}
  api-secret: ${PORTONE_API_SECRET:}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET:}
  api-base-url: https://api.portone.io

policy-rag:
  indexing:
    # 정책 문서 RAG 색인(PolicyDocumentIndexer) on/off. 기동 시 1회 실제 OpenAI 임베딩 API를 호출한다
    # (docs/dev/ongoing/ai-policy-rag.md) — 테스트 환경(src/test/resources/application.yaml)에서는
    # 반드시 false로 꺼서 @SpringBootTest 컨텍스트 로딩마다 실호출이 나가지 않게 한다.
    enabled: true

management:
  # 배포 고도화(도전과제) — Railway의 railway.json(deploy.healthcheckPath)이 이 경로를 불러서
  # 200이 나올 때까지 새 배포로 트래픽을 안 넘긴다(무중단 배포의 실제 메커니즘). health만 노출하고
  # 나머지 actuator 엔드포인트(env/beans 등)는 그대로 막아둔다.
  endpoints:
    web:
      exposure:
        include: health
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId}] %-40.40logger{39} : %m%n"
